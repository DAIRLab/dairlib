build_jammy_task:
  timeout_in: 120m
  container:
    image: ghcr.io/dairlab/docker-dair/jammy-dair-base:v1.42.0-2
    cpu: 8
    memory: 24G
  test_script:
    - bazel build
      --local_resources=memory=24000
      --local_resources=cpu=8
      --jobs=8 
      --remote_http_cache=http://$CIRRUS_HTTP_CACHE_HOST
      //...
    - bazel test
      --local_resources=memory=24000
      --local_resources=cpu=8
      --remote_http_cache=http://$CIRRUS_HTTP_CACHE_HOST
      //...

