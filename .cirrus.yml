build_jammy_task:
  timeout_in: 120m
  container:
    dockerfile: install/jammy/Dockerfile
    cpu: 8
    memory: 24
  test_script:
    - export CC=clang-12
    - export CXX=clang++-12
    - bazel build
      --define=WITH_SNOPT=OFF
      --local_ram_resources=24000
      --local_cpu_resources=8
      --jobs=8 
      ...
    - bazel test
      --define=WITH_SNOPT=OFF
      --local_ram_resources=24000
      --local_cpu_resources=8
      ...
