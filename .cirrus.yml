registry_config: ENCRYPTED[!0a87ac67e240c5bb89044f49c6437615cec7c22faa151949f0648b04911a9e30785a97d897d8796745cb9f72a18732ec!]
build_jammy_task:
  timeout_in: 120m
  container:
    image: docker.io/michaelposa/jammy-dair-base:latest
    cpu: 2
    memory: 4G
  test_script:
    - export CC=clang-12
    - export CXX=clang++-12
    - bazel build
      --local_resources=24000,8
      --jobs=8 
      --remote_http_cache=http://$CIRRUS_HTTP_CACHE_HOST
      //...
    - bazel test
      --local_resources=24000,8
      --remote_http_cache=http://$CIRRUS_HTTP_CACHE_HOST
      //...

drake_master_build_task:
  timeout_in: 120m
  container:
    image: docker.io/michaelposa/jammy-dair-base
    cpu: 2
    memory: 4G
  allow_failures: true
  test_script:
    - git clone https://github.com/RobotLocomotion/drake.git ../drake
    - export DAIRLIB_LOCAL_DRAKE_PATH=$PWD/../drake
    - bazel build
      --local_resources=24000,8
      --jobs=8 
      //...
    - bazel test
      --local_resources=24000,8
      --jobs=8 
      //...
