# And connect state_estimator_->get_contact_output_port() to elevation_mapping_system_->get_input_port_contact()
# in examples/perceptive_locomotion/diagrams/perception_module_diagram.cc
# contact_frames: { left: "toe_left", right: "toe_right" }
# contact_points: { left: [0.088, 0, 0], right: [0.088, 0, 0]}
initialization_radius: 1.0
initialization_offset: 0.0
point_cloud_bias: [0.0, 0.0, 0.0]