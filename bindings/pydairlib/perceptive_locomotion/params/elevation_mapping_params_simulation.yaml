sensor_poses: [
    {
        sensor_name: "pelvis_depth",
        sensor_parent_body: "pelvis",
        sensor_pose_in_parent_body_yaml: "bindings/pydairlib/perceptive_locomotion/params/rgbd_extrinsics.yaml"
    }
]

map_update_trigger_type: "periodic"
base_frame_name: "pelvis"
track_point: [0., 0, 0] #0.5
