trifinger_model: examples/cube_flip/trifinger/robot_properties_fingers/urdf/trifinger_minimal_collision.urdf
object_model: examples/cube_flip/urdf/cube_for_lcs.sdf
end_effector_model: examples/cube_flip/urdf/fingertips.sdf
end_effector_lcs_model: examples/cube_flip/urdf/fingertips_lcs.sdf
end_effector_names: [fingertip_1, fingertip_2, fingertip_3]
ee_base_link_names: [base_link_1, base_link_2, base_link_3]
ground_model: examples/cube_flip/urdf/ground.urdf

osqp_settings_file: examples/cube_flip/trifinger/parameters/trifinger_osqp_settings.yaml
ic3_options_file: examples/cube_flip/trifinger/parameters/trifinger_iC3_options.yaml
c3_options_file: examples/cube_flip/trifinger/parameters/trifinger_c3_options.yaml

track_dynamically_feasible: true # false is currently broken

time_to_wait: 1.0
ee_init_position: [0.4, -0.35, 0.45]

nominal_position: [0, 0.08, 0.05,  # finger 0
                   0.04, -0.08, 0.05,  # finger 120
                   -0.04, -0.08, 0.05]  # finger 240

x_target: [0.0, 0, -0.0,  # finger 1  
         0.0, -0.0, 0.0,   # finger 2
         0.0, 0.0, 0.0,   # finger 3
         0.707, 0, 0.707, 0,  # cube orientation (90 about y)
         0, 0, 0.05,  # cube position
         0, 0, 0,     # finger 1 velo
         0, 0, 0,     # finger 2 velo
         0, 0, 0,     # finger 3 velo
         0, 0, 0,     # cube ang velo
         0, 0, 0]     # cube velo


