visualizer_publish_rate: 30

camera_pose: [0.6, -0.05, 0.25]
camera_target: [0.3, 0.3, 0.1]

visualize_c3_workspace: false
visualize_c3_state: true
visualize_c3_target_state: true
visualize_c3_final_target_state: true

visualize_center_of_mass_plan: false
visualize_c3_forces: false

visualize_is_c3_mode: true
visualize_sample_locations: true
visualize_sample_buffer: true
sample_buffer_point_size: 0.01

visualize_mpm_points: true
mpm_point_size: 0.005

visualize_model_reduction: false   # visualizing C3 state shows this
model_reduction_point_model: examples/deform/models/reduced_mpm_point.urdf

ee_vis_model: examples/deform/models/ee_visualization_model.urdf

visualize_c3_plan_object: true
visualize_c3_plan_robot: true

visualize_cost_plan_object: true
visualize_cost_plan_robot: true

# Note:  Colors can either be empty ([]) or RGB values between 0 and 1.  If left
# empty, the colors defined in the URDF/SDF files will be used.
c3_state_actual_color: [1.0, 0.7, 0.2]
c3_state_target_color: [0.2, 1.0, 0.2]
c3_state_final_target_color: [0.2, 1.0, 0.2]
reduced_model_color: [1.0, 0.7, 0.2]
is_c3_mode_color: [1.0, 0.43, 1.0]
sample_color: [1.0, 1.0, 0.0]
c3_state_object_color: [0.2, 0.8, 0.2]  # For visualizing C3 states
c3_state_ee_color: [0.2, 0.8, 0.2]
c3_object_color: [0.2, 0.8, 0.8]        # For visualizing C3 plans
c3_ee_color: [0.2, 0.8, 0.8]
df_object_color: []
df_ee_color: [0.5, 1.0, 0.5]
