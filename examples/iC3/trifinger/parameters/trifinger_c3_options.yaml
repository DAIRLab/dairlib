  penalize_input_change: false

  num_threads: 10
  delta_option: 1

  admm_iter: 7

  M: 1000
  gamma: 1.0
  rho_scale: 1.0

  w_Q: 5
  w_R: 5000 #Penalty on all decision variables, assuming scalar
  w_G: 100 #Penalty on all decision variables, assuming scalar
