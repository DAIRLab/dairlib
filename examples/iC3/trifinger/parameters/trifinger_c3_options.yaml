
projection_type: "C3+"
solve_time_filter_alpha: 0.0
publish_frequency: 0
state_prediction_joints: []

quaternion_weight: 2000
quaternion_regularizer_fraction: 0.0

lcs_factory_options:
  contact_model: "anitescu"
  num_contacts: 7
  spring_stiffness: 0
  N: 3
  dt: 0.02
  contact_pair_configs:
    - body_A: "fingertip_1"
      body_A_collision_geom_indices: [0]
      body_B: "cube"
      body_B_collision_geom_indices: [0]
      mu: 0.5
      num_friction_directions: 2
    - body_A: "fingertip_2"
      body_A_collision_geom_indices: [0]
      body_B: "cube"
      body_B_collision_geom_indices: [0]
      mu: 0.5
      num_friction_directions: 2
    - body_A: "fingertip_3"
      body_A_collision_geom_indices: [0]
      body_B: "cube"
      body_B_collision_geom_indices: [0]
      mu: 0.5
      num_friction_directions: 2
    - body_A: "cube"
      body_A_collision_geom_indices: [1, 2, 3, 4]
      body_B: "ground"
      body_B_collision_geom_indices: [0]
      mu: 0.5
      num_friction_directions: 2


