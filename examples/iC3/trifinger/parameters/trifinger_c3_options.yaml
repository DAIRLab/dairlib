             5, 5, 5]

  r_vector: [1, 1, 1,        # finger 1 actuation
              1, 1, 1,        # finger 2 actuation
              1, 1, 1]        # finger 3 actuation


  g_x: [100, 100, 100, 100, 100, 100, 100, 100, 100,    # hand pos
