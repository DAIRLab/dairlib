trifinger_model: examples/iC3/trifinger/robot_properties_fingers/urdf/trifinger.urdf
object_model: examples/iC3/urdf/cube_for_lcs_4_contacts.sdf
end_effector_model: examples/iC3/urdf/fingertips.sdf
end_effector_lcs_model: examples/iC3/urdf/fingertips_lcs.sdf
end_effector_names: [fingertip_1, fingertip_2, fingertip_3]
ee_base_link_names: [base_link_1, base_link_2, base_link_3]
ground_model: examples/iC3/urdf/ground.urdf

osqp_settings_file: examples/iC3/trifinger/parameters/trifinger_osqp_settings.yaml
ic3_options_file: examples/iC3/trifinger/parameters/trifinger_iC3_options.yaml
c3_controller_options_file: examples/iC3/trifinger/parameters/trifinger_c3_options.yaml

track_dynamically_feasible: true 

time_to_wait: 1.0

nominal_position: [0, 0.07, 0.07,  # finger 0
                   0.07, -0.055, 0.07,  # finger 120
                   -0.07, -0.055, 0.07]  # finger 240

x_target: [0, 0.07, 0.07,  # finger 1  
          0.07, -0.055, 0.07,   # finger 2
          -0.07, -0.055, 0.07,   # finger 3
          0, 0, 0, 1,  # cube orientation (180 about z)
          0, 0, 0.051,  # cube position
          0, 0, 0,     # finger 1 velo
          0, 0, 0,     # finger 2 velo
          0, 0, 0,     # finger 3 velo
          0, 0, 0,     # cube ang velo
          0, 0, 0]     # cube velo


