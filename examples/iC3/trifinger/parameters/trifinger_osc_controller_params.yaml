controller_frequency: 1000

trifinger_model: examples/iC3/trifinger/robot_properties_fingers/urdf/trifinger.urdf
end_effector_model: examples/iC3/urdf/fingertips.sdf
end_effector_names: ["fingertip_1", "fingertip_2", "fingertip_3"]

neutral_position: [[0, 0.07, 0.05],  # finger 0
                   [ 0.07, -0.055, 0.05],  # finger 120
                   [-0.07, -0.055, 0.05]]  # finger 240

# neutral_position: [[0, 0.07, 0.05],  # finger 0
#                    [ 0.05, -0.07, 0.05],  # finger 120
#                    [-0.05, -0.07, 0.05]]  # finger 240

# task space velocity constraints
velocity_lower_bound: [[-0.075, -0.075, -0.05],  # finger 0
                       [-0.075, -0.075, -0.05],  # finger 120
                       [-0.075, -0.075, -0.05]]  # finger 240
velocity_upper_bound: [[0.075, 0.075, 0.05],  # finger 0
                       [0.075, 0.075, 0.05],  # finger 120
                       [0.075, 0.075, 0.05]]  # finger 240

# velocity_lower_bound: [[-0.15, -0.15, -0.05],  # finger 0
#                        [-0.15, -0.15, -0.05],  # finger 120
#                        [-0.15, -0.15, -0.05]]  # finger 240
# velocity_upper_bound: [[0.15, 0.15, 0.05],  # finger 0
#                        [0.15, 0.15, 0.05],  # finger 120
#                        [0.15, 0.15, 0.05]]  # finger 240
                      
velocity_damping: 10.0  
                    
x_scale: 0.1
y_scale: 0.1
z_scale: 0.1

w_input: 0.0001
w_input_reg: 0.0001
w_accel: 0.0001
w_soft_constraint: 0.0001
w_lambda: 0.0001
impact_threshold: 0.0001
impact_tau: 0.0001
mu: 1.0 # unused
end_effector_acceleration: 10
track_end_effector_orientation: false
cancel_gravity_compensation: false
enforce_acceleration_constraints: true # Currently hardcoded, trifinger sdf doesn't have accleration limits
publish_debug_info: true

w_joint_limit: 10000.0
joint_limit_buffer: 0.1

W_accel: [ 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01 ]
W_input_reg: [ 1, 1, 1, 1, 1, 1, 1, 1, 1 ]
