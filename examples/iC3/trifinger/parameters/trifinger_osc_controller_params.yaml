                  0.0001, 0.0001, 0.0001,
                  0.0001, 0.0001, 0.0001,
                  0.0001, 0.0001, 0.0001 ]
W_lambda_h_reg: [ 0.0001, 0.0001, 0.0001,
                  0.0001, 0.0001, 0.0001 ]

