ee_file: "examples/iC3/urdf/allegro_hand_description_right.urdf" 
cube_file: "examples/iC3/urdf/actual_cube.sdf" 

visualizer_publish_rate: 30

# match with iC3 params
ic3_num_iters: 6
trajectory_length: 105

iter_downsampling_factor: 2
downsampling_factor: 7

trajectory_lcm_channel_x: "iC3_TRAJECTORY_X"
trajectory_lcm_channel_u: "iC3_TRAJECTORY_U"
trajectory_lcm_channel_c3: "iC3_TRAJECTORY_C3"
trajectory_lcm_channel_x_real: "iC3_TRAJECTORY_X_REAL"
trajectory_lcm_channel_plate: "iC3_TRAJECTORY_PLATE"

# Just for drawing the init/target pose, no effect on trajectory
x_init: [0, 0.5, 0.8, 0.9,       # index
         0, 0.5, 0.8, 0.9,       # middle
         0, 0.5, 0.8, 0.9,       # ring   
         0.6, 1.1, 0.6, 0.6,     # thumb
         1, 0, 0, 0,             # cube orientation
         0, 0, 0.05,             # cube position
         0, 0, 0, 0,             # index velo
         0, 0, 0, 0,             # middle velo
         0, 0, 0, 0,             # ring velo
         0, 0, 0, 0,       	 		 # thumb velo
         0, 0, 0,       	 			 # cube ang velo
         0, 0, 0]           		 # cube velo


x_des: [0, 0.5, 0.8, 0.9,        # index
        0, 0.5, 0.8, 0.9,        # middle
        0, 0.5, 0.8, 0.9,        # ring   
        0.6, 1.1, 0.6, 0.6,      # thumb
        0, 0, 0, 1,        			 # cube orientation
        0, 0, 0.05,              # cube position
        0, 0, 0, 0,       			 # index velo
        0, 0, 0, 0,       			 # middle velo
        0, 0, 0, 0,       			 # ring velo
        0, 0, 0, 0,       			 # thumb velo
        0, 0, 0,          			 # cube ang velo
        0, 0, 0]          			 # cube velo

trace_color: [1.0, 0.64, 0.0]
ee_trace_color: [0, 0.64, 1.0]
