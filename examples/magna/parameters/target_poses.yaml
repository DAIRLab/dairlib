target_poses:
  # Move from initial position to pre-grasp position, grasp the belt, and wait for 0.5 seconds
  - position: [0.71241, -0.053, 0.001]
    orientation: [0.7071068, 0, 0, -0.7071068]
    gripper_pos_command: -0.1
    dwell_seconds: 0.5
    center: [0, 0, 0]
    radius: -1
  # Move back along negative x axis
  - position: [0.57241, -0.052, 0.01]
    orientation: [0.7071068, 0, 0, -0.7071068]
    gripper_pos_command: -0.1
    dwell_seconds: 0.0
    center: [0, 0, 0]
    radius: -1
  # Move straight up along positive z axis
  - position: [0.57241, -0.052, 0.21]
    orientation: [0.7071068, 0, 0, -0.7071068]
    gripper_pos_command: -0.1
    dwell_seconds: 1.8
    center: [0, 0, 0]
    radius: -1
  # Start engaging the belt into the large pulley
  - position: [0.61241, -0.052, 0.19]
    orientation: [0.7071068, 0, 0, -0.7071068]
    gripper_pos_command: -0.1
    dwell_seconds: 0.0
    center: [0, 0, 0]
    radius: -1
  # Pulling the belt and lower down the end effector
  - position: [0.73241, -0.052, 0.03]
    orientation: [0.7071068, 0, 0, -0.7071068]
    gripper_pos_command: -0.1
    dwell_seconds: 0.5
    center: [0, 0, 0]
    radius: -1
  # Move backward to reduce stress on the belt
  - position: [0.72241, -0.052, 0.04]
    orientation: [0.7071068, 0, 0, -0.7071068]
    gripper_pos_command: -0.1
    dwell_seconds: 0.5
    center: [0, 0, 0]
    radius: -1
  # Rotate the belt around the large pulley and approach on top of the small pulley
  - position: [0.48226, 0.188, 0.04]
    orientation: [1, 0, 0, 0]
    gripper_pos_command: -0.1
    dwell_seconds: 0.5
    center: [0.48226, -0.052, 0.04]
    radius: 0.24
