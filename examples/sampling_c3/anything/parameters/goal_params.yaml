# Goal mode options (defined as GoalMode enum in goal_params.h):
#   0. kRandom:               randomly generate a new goal.
#   1. kOrientationSequence:  keep position goal the same, and cycle through a
#                             sequence of orientations.
#   2. kFixedGoal:            keep the same goal.
goal_mode: 0

### Parameters used for multiple goal modes.
# Success thresholds for position and orientation.
position_success_threshold: 0.02
orientation_success_threshold: 0.1  # 0.1 rad = 5.7 degrees
only_use_xy_position: true

resting_object_height: -0.004                # in world frame
resting_object_heights: [-0.004748000000000002]                                                       # in world frame
ee_target_z_offset_above_object: 0.06   # defines EE goal w.r.t. object position

# Lookahead parameters to define a sub-goal for C3.
lookahead_step_size: 0.15   # meters
lookahead_angle: 2          # rad

# Apply hysteresis on the lookahead angle so the sub-goal orientation doesn't
# flip back and forth near the 180 degree error singularity.  A lower number
# means the sub-goal orientation can switch more often; a higher number means
# the sub-goal orientation is more stable but possibly less optimal.
angle_hysteresis: 0.4

# Factor to convert an angular error to angular velocity command (0=disabled).
angle_err_to_vel_factor: 0

# Initial goal (and only goal for fixed goal mode) DEPRECATED.
fixed_target_position: [0.65, 0.18745379, -0.004]
fixed_target_orientation: [-0.9327733, 0, 0, 0.36046353]

fixed_target_positions: [[0.45, -0.3, -0.004748000000000002]]
fixed_target_orientations: [[0.707, 0, 0, 0.707]]
#fixed_target_positions: [[0.5, -0.27, -0.029], [.5, -0.020000000000000018, -0.028999999999999988]]
#fixed_target_orientations: [[0, 0, 0, 1], [0, 0, 0, 1]]


# Random-specific parameters.
random_goal_x_limits: [0.45, 0.55]
random_goal_y_limits: [-0.25, 0.25]
random_goal_radius_limits: [0.5, 0.52]

random_goal_gen_max_attempts: 100
pairwise_goal_distance: 0.2  # How far each pair of goals must be from each other
