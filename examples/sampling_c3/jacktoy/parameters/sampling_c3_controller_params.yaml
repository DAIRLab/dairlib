sampling_params_file: examples/sampling_c3/jacktoy/parameters/sampling_params.yaml
reposition_params_file: examples/sampling_c3/jacktoy/parameters/reposition_params.yaml
progress_params_file: examples/sampling_c3/jacktoy/parameters/progress_params.yaml
osqp_settings_file: examples/sampling_c3/shared_parameters/franka_c3_qp_settings.yaml

# Note:  Use capsule_1 body name as representative of the pose of the entire
# jack model.  This works because capsule_1's origin is the same as the jack's.
object_model: examples/sampling_c3/urdf/jack_ground.sdf
object_body_name: capsule_1

include_end_effector_orientation: false

control_loop_delay_ms: 0
