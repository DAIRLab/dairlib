####### WARNING!! Make sure that if we want to do orientation tracking and use a lookahead, the lookahead step size 
####### needs to be bigger than the orientation tracking threshold, i.e. cost_switching_threshold_distance in 
lookahead_step_size: 0.15   
lookahead_angle: 2       
angle_hysteresis: 0.4         # 0.785 is 45 degrees, 0.698 is 40 degrees .
                              # Hysteresis for locking onto a rotation
                              # direction.  The smaller this is, the more often
                              # the lookahead orientation target can switch when
                              # the rotational error is near 180 degrees.  The
                              # larger this is, the lookahead orientation target
                              # will be more stable but possibly guide progress
                              # in the less optimal direction.
# factor for converting an angular error to angular velocity command.
angle_err_to_vel_factor: 0    

# goal height of the end effector above the object
ee_target_z_offset_above_object: 0.06

