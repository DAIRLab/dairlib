# Trajectory generation parameters

# 0 to randomize goal, 1 to cycle through orientations, 2 to fix goal
goal_mode: 0  
# Thresholds for position and orientation for reaching a goal successfully.
position_success_threshold: 0.02
orientation_success_threshold: 0.1   # 0.1 rad = 5.7 degrees
# Limits for random goal generation.
random_goal_x_limits: [0.42, 0.5]
random_goal_y_limits: [0.02, 0.25]
random_goal_radius_limits: [0.48, 0.5]
# z height of the object when flat on the table.
resting_object_height: 0.031971466           

