ee_vis_model: examples/sampling_c3/urdf/ee_visualization_model.urdf
object_vis_models: [examples/sampling_c3/urdf/jack.sdf]
visualizer_publish_rate: 30

camera_pose: [1.5, 0, 0.6]
camera_target: [0.5, 0, 0.5]

visualize_c3_workspace: false
visualize_c3_state: true

visualize_center_of_mass_plan_curr: false
visualize_c3_forces_curr: false
