sampling_c3_options_file: examples/sampling_c3/three_d_printer/cone/parameters/sampling_c3plus_options.yaml
reposition_params_file: examples/sampling_c3/three_d_printer/printer_shared_parameters/reposition_params.yaml
progress_params_file: examples/sampling_c3/three_d_printer/printer_shared_parameters/progress_params_c3plus.yaml
sampling_params_file: examples/sampling_c3/three_d_printer/printer_shared_parameters/sampling_params.yaml
goal_params_file: examples/sampling_c3/three_d_printer/cone/parameters/goal_params.yaml

sim_params_file: examples/sampling_c3/three_d_printer/cone/parameters/sim_params.yaml
vis_params_file: examples/sampling_c3/three_d_printer/cone/parameters/vis_params.yaml
osc_params_file: examples/sampling_c3/three_d_printer/printer_shared_parameters/osc_params.yaml
osqp_settings_file: examples/sampling_c3/shared_parameters/sampling_c3_qp_settings.yaml
osc_qp_settings_file: examples/sampling_c3/shared_parameters/osc_qp_settings.yaml
franka_driver_channels_file: UNUSED
lcm_channels_hardware_file: examples/sampling_c3/three_d_printer/printer_shared_parameters/lcm_channels_hardware.yaml
lcm_channels_simulation_file: examples/sampling_c3/three_d_printer/printer_shared_parameters/lcm_channels_simulation.yaml

object_models: [examples/sampling_c3/urdf/cone/cone_controller.sdf]
base_names: [cone]

# Optional per-goal-step keep-out geometry: one entry per step in
# goal_params.yaml's fixed_target_position_sequence (startup throws on a length
# mismatch).  "" = no keep-out regions for that goal; otherwise a URDF path (see
# examples/sampling_c3/urdf/cone/keep_out_example.urdf) whose obstacle geometry
# samples must avoid for that goal.
keep_out_model_sequence: ["", "", "examples/sampling_c3/urdf/cone/keep_out_goal_2.urdf"]

include_end_effector_orientation: false  # Unused for 3D printer
                                         # (orientation never included).

control_loop_delay_ms: 0
