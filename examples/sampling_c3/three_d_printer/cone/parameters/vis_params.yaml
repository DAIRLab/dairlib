ee_vis_model: examples/sampling_c3/urdf/three_d_printer/three_d_printer_ee_visualization_model.urdf
object_vis_models: [examples/sampling_c3/urdf/cone/cone.sdf]
visualizer_publish_rate: 30

camera_pose: [0.4, -0.5, 0.35]
camera_target: [0.2, 0, 0.2]

visualize_c3_workspace: false
visualize_c3_state: true

# keep_out_color can be empty ([]), [r, g, b] (alpha defaults to 0.25), or
# [r, g, b, a].
visualize_keep_out_regions: true
keep_out_color: [0.9, 0.2, 0.2, 0.25]

# Draws the simulator's uncorrupted object state (published on the lcm
# channels' clean_object_state_channels when sim_params'
# inject_object_state_errors is true) as a translucent ghost.  Note that the
# opaque object is driven by object_state_channels, i.e. it shows the estimate
# the controller sees, so with error injection on the ghost is the truth.
# Ignored when clean_object_state_channels is unset, e.g. on hardware.
visualize_clean_object_state: true
clean_object_state_color: [0.2, 0.8, 0.2]
clean_object_state_alpha: 0.4

visualize_center_of_mass_plan_curr: false
visualize_c3_forces_curr: false
visualize_center_of_mass_plan_best: false
visualize_c3_forces_best: false

visualize_is_c3_mode: true
visualize_sample_locations: true
visualize_sample_buffer: true
sample_buffer_point_size: 0.002
visualize_unsuccessful_sample_buffer: true

# Note:  Colors can either be empty ([]) or RGB values between 0 and 1.  If left
# empty, the colors defined in the URDF/SDF files will be used.
is_c3_mode_color: [1.0, 0.43, 1.0]
sample_color: [1.0, 1.0, 0.0]
unsuccessful_sample_buffer_color: [0.4, 0.4, 0.4]

visualize_execution_plan: false

visualize_c3_plan_curr: true
c3_curr_object_color: []
c3_curr_ee_color: [0.8, 0.8, 0.8]
df_curr_object_color: []
df_curr_ee_color: [0.5, 1.0, 0.5]

visualize_c3_plan_best: false
c3_best_object_color: [1.0, 0.64, 0.0]
c3_best_ee_color: [1.0, 0.64, 0.0]
df_best_object_color: [1.0, 0.64, 0.0]
df_best_ee_color: [1.0, 0.64, 0.0]

# Meshcat tree paths that, if present, are initially unchecked to hide the
# visual.  This can be helpful to keep the visualizer clean but still leave
# available the option to view more debugging tools.
initially_hidden_meshcat_paths:
  - c3_state/c3_actual_ee
  - c3_state/c3_target_ee
  - visualizer/plans
  - visualizer/samples_pose_trace/end_effector_simple
  # intentionally leave samples_pose_trace/end_effector_simple_1 visible
  - visualizer/samples_pose_trace/end_effector_simple_2
  - visualizer/samples_pose_trace/end_effector_simple_3
  - visualizer/samples_pose_trace/end_effector_simple_4
  - visualizer/samples_pose_trace/end_effector_simple_5
  - visualizer/samples_pose_trace/end_effector_simple_6
