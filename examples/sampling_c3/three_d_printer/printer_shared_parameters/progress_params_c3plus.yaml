# Ways of computing C3 costs after solving the MPC problem (defined as
# C3CostComputationType enum in progress_params.h):
#  0. kSimLCS:                       Simulate the LCS dynamics from the planned
#                                    inputs.
#  1. kUseC3Plan:                    Use the C3 planned trajectory and inputs.
#  2. kSimLCSReplaceC3EEPlan:        Simulate the LCS dynamics from the planned
#                                    inputs only for the object; use the planned
#                                    EE trajectory.
#  3. kSimImpedance:                 Try to emulate the real cost of the system
#                                    associated not only applying the planned
#                                    inputs, but also tracking the planned EE
#                                    trajectory with an impedance controller.
#  4. kSimImpedanceReplaceC3EEPlan:  The same as kSimImpedance except the EE
#                                    states are replaced with the plan from C3
#                                    at the end.
#  5. kSimImpedanceObjectCostOnly:   The same as kSimImpedance except only the
#                                    object terms contribute to the final cost.
#  6. kSimImpedanceRetimedObjectCostOnly:
#                                    The same as kSimImpedanceObjectCostOnly
#                                    except the EE plan is first slowed to the
#                                    configured EE velocity limits and then
#                                    resampled back onto the original knot
#                                    times, so every sample's cost covers the
#                                    same amount of time and a plan that has to
#                                    be slowed down simply gets less far.
cost_type: 6
cost_type_position: 6

# Progress metric to use to determine if C3 is making progress, all phrased as
# improvement requirements over a number of control loops (defined as
# ProgressMetric enum in progress_params.h)
#  0. kC3Cost:            C3 cost.
#  1. kConfigCost:        Current object configuration cost.
#  2. kPosOrRotCost:      Current position or rotation error.
#  3. kConfigCostDrop:    Drop in object configuration cost (this is the same as
#                         kConfigCost if the required drop is 0; a more
#                         aggressive drop cuts C3 off earlier).
track_c3_progress_via: 3

# Ignore orientation errors when object is beyond this threshold from the goal.
cost_switching_threshold_distance: 0.05

# Optional per-goal-step override of cost_switching_threshold_distance, one
# entry per step in goal_params.yaml's fixed_target_position_sequence (startup
# throws on a length mismatch).  Comment out to use the single value above for
# every goal.
cost_switching_threshold_distance_sequence: [0.0, 0.0, 0.08]

# Release the pose-tracking cost once the object has stayed this far (m) beyond
# the active threshold for this long (s), e.g. after sliding back down the ramp.
# It re-latches normally once back inside.  Comment out both to latch until the
# goal changes.
cost_switching_unlatch_margin: 0.01
cost_switching_unlatch_seconds: 2.0

# Penalize repositioning distance.
travel_cost_per_meter: 0

# Number of control loops to wait before cutting off C3 due to unproductivity.
# Used for kC3Cost, kConfigCost, kPosOrRotCost.
num_control_loops_to_wait: 5
num_control_loops_to_wait_position: 5

# kConfigCostDrop parameters.
progress_enforced_cost_drop: 0.4
progress_enforced_over_n_loops: 60

### Hysteresis parameters for switching between C3 and repositioning modes.
finished_reposition_cost: 1000000000

hyst_c3_to_repos: 300000
hyst_c3_to_repos_position: 300000
hyst_repos_to_c3: 200000
hyst_repos_to_c3_position: 200000
hyst_repos_to_repos: 60000000000000
hyst_repos_to_repos_position: 60000000000000

# Relative hysteresis is in terms of a fraction of the current cost.
use_relative_hysteresis: true
hyst_c3_to_repos_frac: 0.9
hyst_c3_to_repos_frac_position: 0.6
hyst_repos_to_c3_frac: 0.4
hyst_repos_to_c3_frac_position: 0.5
hyst_repos_to_repos_frac: 0.55
hyst_repos_to_repos_frac_position: 0.4

# Nominate-then-confirm gate on repos->repos, c3->repos, and repos->c3 switches.
# A challenger that wins the hyst_{MODE_to_MODE}_frac comparison is held as a
# nominee rather than adopted, re-scored as a real candidate on the next control
# loop, and adopted only if it still beats the incumbent by this fraction of the
# incumbent's raw cost.  0.0 means "must merely not have gotten worse".  Omit
# both the *_frac and *_frac_position keys to switch immediately for that kind
# of transition instead of nominating.
repos_target_confirm_frac: 0.3
repos_target_confirm_frac_position: 0.0
c3_to_repos_confirm_frac: 0.2
c3_to_repos_confirm_frac_position: 0.0
repos_to_c3_confirm_frac: 0.3
repos_to_c3_confirm_frac_position: 0.3

# Leave C3 for repositioning on every goal change rather than carrying the old
# goal's push into the new one, and keep C3 off that spot until the object
# moves.  The 2026-09-23 hardware runs entered goal 2 mid-push at 19-40 mm and
# two of three jammed the cone into the ramp toe within 1.4 s.
force_repos_on_goal_change: true

# Live jam watchdog:  allow the controller to switch C3 -> Repos if it detects
# the EE is jammed against the object.  This is a safety feature to get out of
# dangerous situations faster than the other C3 -> Repos switching logic.  Omit
# these parameters entirely to turn the watchdog off.
jam_guard:
  gap_trip: -0.010    # gate 1a:  penetration [m] (negative = penetration)
  gap_release: 0.002  # do "unjam" maneuver until signed distance >= this
  object_travel_trip: 0.003       # gate 1b:  object estimate must have moved no
                                  # more than this [m] over the window below.
                                  # The signal is max_i ||p_i - p_now|| over the
                                  # window, not endpoint displacement.
  object_travel_release: 0.006    # a moving object means the jam is over, so
                                  # this releases on its own
  object_travel_window_seconds: 0.3 # gate 1b cannot arm until this has filled,
                                    # which sets the floor on detection latency
  force_trip: 9.0     # gate 2:  EE-object force [N] within force_gate_gap
  force_release: 4.0  # do "unjam" maneuver until force <= this, or gate opens
  force_gate_gap: 0.002   # enable gate 2 if signed distance <= this [m]
  trip_hold_seconds: 0.3  # latch once either gate has been armed for this
                          # long consecutively
  release_hold_seconds: 0.5   # do "unjam" maneuver until release condition ran
                              # for this long consecutively
  retreat_knots: 2    # while latched, prepend this many "unjam" knots to
                      # repositioning trajectory, each one knot period of
                      # travel along the object surface normal at the fastest
                      # speed reposition_params' speed_horizontal /
                      # speed_vertical allow in that direction
  # Deep tier:  trip when the gap from the printer's REPORTED EE position (not
  # the predicted one) stays below deep_gap_trip for deep_trip_hold_seconds,
  # whatever the object does.  The printer reports stepper position, so a
  # jammed finger that bends shows up as the EE driving into and through the
  # object; the gates above miss it because the predicted-EE gap flips positive
  # once it crosses the object's axis.  Scored offline on the 2026-09-23 logs
  # (three_d_printer/test/score_deep_jam_guard.py):  one trip per hardware run,
  # each at its launch event (1.1 s and 0.7 s ahead of hw0/hw2's launch), none
  # elsewhere on hardware, and 1 across the five realistic-sim runs.  Not
  # comparable with gap_trip, which is measured from the predicted EE.  Omit
  # both keys to turn the tier off.
  deep_gap_trip: -0.011
  deep_trip_hold_seconds: 0.2
